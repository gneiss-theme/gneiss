# Releases Gneiss when a version tag, such as v0.1.0, is pushed. The tag must
# be palette.toml's version, and CHANGELOG.md must date that version. It runs
# the flake's checks, publishes the VS Code extension to the Visual Studio
# Marketplace and Open VSX, and creates a GitHub release with every port's
# files and that version's changelog. Each step can be rerun: a version
# that's already published or released is left as it is.
#
# The Marketplace trusts this workflow through Trusted Publishing, so no
# token is stored for it. Open VSX uses the OVSX_PAT secret until a trusted
# publisher is registered there; once the secret is removed, ovsx uses
# trusted publishing too.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Check the tag and the changelog
        id: version
        run: |
          version=$(nix eval --raw .#lib.palette.meta.version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME isn't palette.toml's version, v$version." >&2
            exit 1
          fi
          if ! grep -qE "^## $version \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated section for $version, such as '## $version (2026-01-31)'." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: nix flake check --print-build-logs

      - name: Gather the release's files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release obsidian/Gneiss
          cp "$(nix build --no-link --print-out-paths .#vsix)" "release/gneiss-$VERSION.vsix"
          cp colors/gneiss.lua release/gneiss.lua
          cp dist/alacritty/gneiss.toml release/gneiss-alacritty.toml
          cp dist/vicinae/gneiss.toml release/gneiss-vicinae.toml
          cp dist/obsidian/theme.css dist/obsidian/manifest.json obsidian/Gneiss/
          (cd obsidian && nix shell --inputs-from .. nixpkgs#zip -c zip -qr ../release/gneiss-obsidian.zip Gneiss)
          awk -v heading="## $VERSION (" 'index($0, heading) == 1 { found = 1; next } /^## / && found { exit } found' \
            CHANGELOG.md > notes.md
          ls -l release

      - name: Install the publishing tools
        run: nix shell --inputs-from . nixpkgs#nodejs -c npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund

      - name: Publish to the Visual Studio Marketplace
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          nix shell --inputs-from . nixpkgs#nodejs -c .github/release/node_modules/.bin/vsce publish \
            --oidc --skip-duplicate --packagePath "release/gneiss-$VERSION.vsix"

      - name: Publish to Open VSX
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          nix shell --inputs-from . nixpkgs#nodejs -c .github/release/node_modules/.bin/ovsx publish \
            --skip-duplicate --packagePath "release/gneiss-$VERSION.vsix"

      - name: Create the GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "Gneiss $VERSION" --notes-file notes.md
          fi
