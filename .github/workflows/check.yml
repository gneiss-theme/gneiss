# Runs the flake's checks on each system it supports: the committed files
# match a fresh render, the contrast ratios hold, Neovim loads the
# colorscheme, and every port builds.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # x86_64-linux, aarch64-linux and aarch64-darwin.
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix flake check --print-build-logs
